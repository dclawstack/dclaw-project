{{- if .Values.secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dclaw-project.secretName" . }}
  labels:
    app.kubernetes.io/name: {{ include "dclaw-project.name" . }}
    app.kubernetes.io/part-of: dclaw-platform
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
