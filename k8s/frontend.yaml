apiVersion: apps/v1
kind: Deployment
metadata:
  name: dclaw-project-frontend
  namespace: dclaw-core
  labels:
    app.kubernetes.io/name: dclaw-project
    app.kubernetes.io/part-of: dclaw-platform
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dclaw-project
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dclaw-project
        app.kubernetes.io/part-of: dclaw-platform
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: docker.io/library/dclaw-project-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3045
              name: http
          env:
            - name: PORT
              value: "3045"
            # Server-side rewrite target for /api/* and /health/* (next.config.mjs).
            - name: BACKEND_URL
              value: "http://dclaw-project-backend:8100"
            - name: OTEL_SERVICE_NAME
              value: "dclaw-project-frontend"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://clickstack-otel-collector.observability.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=dclaw-core,deployment.environment=production"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dclaw-project
  namespace: dclaw-core
  labels:
    app.kubernetes.io/name: dclaw-project
    app.kubernetes.io/part-of: dclaw-platform
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  ports:
    - port: 3045
      targetPort: http
      nodePort: 30045
      name: http
  selector:
    app.kubernetes.io/name: dclaw-project
