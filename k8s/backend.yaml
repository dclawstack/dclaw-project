apiVersion: apps/v1
kind: Deployment
metadata:
  name: dclaw-project-backend
  namespace: dclaw-core
  labels:
    app.kubernetes.io/name: dclaw-project-backend
    app.kubernetes.io/part-of: dclaw-platform
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dclaw-project-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dclaw-project-backend
        app.kubernetes.io/part-of: dclaw-platform
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: docker.io/library/dclaw-project-backend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8100
              name: http
          envFrom:
            - secretRef:
                name: dclaw-project-secret
          env:
            - name: OTEL_SERVICE_NAME
              value: "dclaw-project"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://clickstack-otel-collector.observability.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=dclaw-core,deployment.environment=production"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
          livenessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dclaw-project-backend
  namespace: dclaw-core
  labels:
    app.kubernetes.io/name: dclaw-project-backend
    app.kubernetes.io/part-of: dclaw-platform
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8100
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: dclaw-project-backend
